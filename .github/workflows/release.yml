name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check manifest version matches the tag
        run: |
          version=$(jq -r .version custom_components/netatmo_smarthome/manifest.json)
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "manifest.json version ${version} does not match tag ${GITHUB_REF_NAME}"
            exit 1
          }
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        # A release created from the GitHub web page already exists: keep it.
        run: |
          gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1 ||
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
